name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  wheel-smoke:
    name: wheel smoke + version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable (deps for import check)
        run: python -m pip install -e .
      - name: Version consistency (pyproject vs __version__)
        shell: bash
        run: |
          python - <<'PY'
          import tomllib, pathlib
          import lesson_book as pkg
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          actual = pkg.__version__
          assert expected == actual, f"pyproject {expected} != __version__ {actual}"
          print("version OK:", actual)
          PY
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Fresh-venv install smoke
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/smoke-venv/bin/lb version
          /tmp/smoke-venv/bin/python -c "import importlib.metadata as m; print('installed dist:', m.version('lesson-book'))"
